<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>igogo web-system</title>
<style>
:root{--page:#f9f9f7;--card:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--bd:rgba(11,11,11,.1);--acc:#2a78d6}
@media (prefers-color-scheme:dark){:root{--page:#0d0d0d;--card:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--bd:rgba(255,255,255,.1);--acc:#3987e5}}
*{box-sizing:border-box;margin:0}
body{background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;padding:48px 20px}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:22px}
p{color:var(--ink2);font-size:13.5px;margin-top:4px}
a.card{display:block;background:var(--card);border:1px solid var(--bd);border-radius:12px;
  padding:18px 20px;margin-top:16px;text-decoration:none;color:var(--ink)}
a.card:hover{border-color:var(--acc)}
a.card .t{font-weight:700;font-size:16px}
a.card .d{color:var(--ink2);font-size:13px;margin-top:3px}
</style>
</head>
<body>
<div class="wrap">
  <h1>igogo web-system</h1>
  <p>內部報表入口</p>
  <a class="card" href="profit/">
    <div class="t">📊 通路 × 品牌 毛利 Dashboard</div>
    <div class="d">各平台/品牌的營收、費用分攤與貢獻利益（資料源：通路獲利分析記錄表）</div>
  </a>
</div>
</body>
</html>
