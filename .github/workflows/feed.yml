name: build-google-feed

on:
  schedule:
    - cron: "30 15 * * *"   # 每天 23:30 台北（UTC 15:30），Merchant Center 00:00 抓
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feed
        run: python feeds/build_feed.py
      - name: Commit if changed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add feeds/igogosport_google.xml feeds/feed_report.json
          git diff --cached --quiet && echo "no change" || git commit -m "feed: auto-build $(date -u +%Y-%m-%d)" && git push
