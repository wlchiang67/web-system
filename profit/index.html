<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>igogo 毛利儀表板</title>
<style>
:root{
  --page:#161616; --surface-1:#1f1f1f; --panel:#1a1a1a;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#3a3a38; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#199e70; --neg:#e66767; --chip:#262626; --chip-bd:#3a3a3a;
}
*{box-sizing:border-box;margin:0}
body{background:var(--page);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;
  font-size:14px;line-height:1.45;padding:0 0 48px}
.topbar{display:flex;align-items:center;gap:18px;padding:14px 22px;
  border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--page);z-index:5}
.topbar h1{font-size:17px;font-weight:700}
.tab{font-size:13px;color:var(--ink-2);background:var(--chip);border-radius:8px;
  padding:5px 12px;text-decoration:none}
.tab.on{color:#fff;background:var(--surface-1);outline:1px solid var(--border);font-weight:600}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink-2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--s2);margin-right:6px}
.reload{font:inherit;font-size:12.5px;color:var(--ink);background:var(--chip);
  border:1px solid var(--chip-bd);border-radius:8px;padding:6px 14px;cursor:pointer}
.reload:hover{border-color:var(--s1)}
.wrap{max-width:1280px;margin:0 auto;padding:16px 22px}
.frow{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.frow .lb{font-size:13px;color:var(--muted);width:44px;flex:none;padding-top:5px}
.frow .chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.chip{font:inherit;font-size:13px;color:var(--ink-2);background:transparent;
  border:1px solid var(--chip-bd);border-radius:999px;padding:4px 14px;cursor:pointer;user-select:none;white-space:nowrap}
.chip:hover{border-color:var(--s1);color:var(--ink)}
.chip.on{background:var(--s1);border-color:var(--s1);color:#fff;font-weight:600}
.chip.dim{opacity:.5}
.chip.exp{border-style:dashed;color:var(--muted)}
.search{font:inherit;font-size:13px;color:var(--ink);background:var(--chip);
  border:1px solid var(--chip-bd);border-radius:999px;padding:5px 14px;width:180px}
.search::placeholder{color:var(--muted)}
.platbox{max-height:118px;overflow-y:auto;display:flex;flex-wrap:wrap;gap:7px;flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:16px 0 14px}
.kpi{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.kpi .t{font-size:12px;color:var(--ink-2)}
.kpi .v{font-size:24px;font-weight:700;margin-top:2px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;
  padding:14px 16px;margin-bottom:12px}
.card h2{font-size:14px;font-weight:700}
.card .note{font-size:12px;color:var(--muted);margin-top:1px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-top:6px}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg text{font-family:inherit}
.hrow{cursor:pointer}
.hrow:hover .hbarbg{fill:var(--grid)}
#tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--border);
  border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.5);padding:8px 11px;font-size:12.5px;
  color:var(--ink);display:none;z-index:10;max-width:260px}
#tip .h{font-weight:700;margin-bottom:3px}
#tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--ink-2)}
#tip .r b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--ink-2);font-weight:600;border-bottom:1px solid var(--axis);padding:6px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--grid);padding:6px 8px;font-variant-numeric:tabular-nums}
td.n,th.n{text-align:right}
tr:hover td{background:rgba(255,255,255,.03)}
.negv{color:var(--neg)}
footer{color:var(--muted);font-size:12px;margin-top:18px;line-height:1.7}
a{color:var(--s1)}
</style>
</head>
<body>
<div class="topbar">
  <h1>毛利儀表板</h1>
  <span class="tab on">通路×品牌</span>
  <a class="tab" href="https://igogosport.github.io/erp-sales-dashboard/" target="_blank">銷售儀表板 ↗</a>
  <div class="right">
    <span><span class="dot"></span>已更新 <span id="upd">–</span></span>
    <button class="reload" onclick="location.reload(true)">↻ 重新讀取</button>
  </div>
</div>
<div class="wrap">
  <div class="frow"><span class="lb">品牌</span><div class="chips" id="fBrand"></div></div>
  <div class="frow"><span class="lb">通路</span><div class="chips" id="fType"></div></div>
  <div class="frow"><span class="lb">平台</span>
    <div style="flex:1;display:flex;gap:8px;flex-direction:column">
      <input class="search" id="platSearch" placeholder="搜尋平台名…">
      <div class="platbox" id="fPlat"></div>
    </div>
  </div>
  <div id="timeRows"></div>
  <div style="font-size:12px;color:var(--muted);padding:8px 0 0">
    單擊＝單選（再點同一顆取消）；按住 <b style="color:var(--ink-2)">Ctrl</b> 點擊＝複選。時間以月為單位，僅列費用登記完成的月份。</div>

  <div class="kpis" id="kpis"></div>

  <div class="card">
    <h2>月度趨勢</h2>
    <div class="note" id="trendNote"></div>
    <div class="legend">
      <span><span class="sw" style="background:var(--s1)"></span>營收</span>
      <span><span class="sw" style="background:var(--s2)"></span>貢獻利益</span>
    </div>
    <div id="trend"></div>
  </div>

  <div class="grid2">
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px">
        <h2>通路貢獻</h2><span id="chTop" style="display:flex;gap:6px"></span>
      </div>
      <div class="note">單擊＝只看該平台，Ctrl＋點＝複選</div>
      <div id="chBarsBox"><div id="chBars"></div></div>
    </div>
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px">
        <h2>品牌貢獻</h2><span id="brTop" style="display:flex;gap:6px"></span>
      </div>
      <div class="note">單擊＝只看該品牌，Ctrl＋點＝複選</div>
      <div id="brBarsBox"><div id="brBars"></div></div>
    </div>
  </div>

  <div class="card">
    <h2 id="tblTitle">明細表</h2>
    <div style="overflow-x:auto;margin-top:8px"><div id="tbl"></div></div>
  </div>

  <footer id="foot"></footer>
</div>
<div id="tip"></div>

<script>
const $=id=>document.getElementById(id);
const fmt=v=>Math.round(v).toLocaleString("en-US");
const fmtW=v=>{const a=Math.abs(v);
  if(a>=1e8) return (v/1e8).toFixed(2)+"億";
  if(a>=1e4) return Math.round(v/1e4).toLocaleString()+"萬";
  return fmt(v);};
const pct=(a,b)=>b?((a/b*100).toFixed(1)+"%"):"–";
let DATA=null, CH=[], BR=[], NAME={}, TEAM={}, MONTHS=[];
let PLATS=[], BRANDS=[];
const S={months:new Set(), plats:new Set(), brands:new Set(), type:"all", platQ:"", chTop:20, brTop:20};
const isEC=code=>(TEAM[code]||"").includes("電商");
const typeOK=code=>S.type==="all"||(S.type==="ec"?isEC(code):!isEC(code));

fetch("data/profit.json").then(r=>r.json()).then(d=>{
  DATA=d;
  // 費用未登完的月份不列入儀表板
  CH=d.channel_rows.map(r=>({ym:r[0],code:r[1],plat:r[2],team:r[3],rev:r[4],cogs:r[5],fee:r[6]+r[7]}))
    .filter(r=>r.ym<=d.fees_through);
  BR=d.brand_rows.map(r=>({ym:r[0],code:r[1],brand:r[2],rev:r[3],cogs:r[4],fee:r[5]}))
    .filter(r=>r.ym<=d.fees_through);
  CH.forEach(r=>{if(r.code){if(!NAME[r.code])NAME[r.code]=r.plat;if(!TEAM[r.code])TEAM[r.code]=r.team||"";}});
  MONTHS=[...new Set(CH.map(r=>r.ym))].sort();
  MONTHS.forEach(m=>S.months.add(m));   // 預設全選
  const pa={};CH.forEach(r=>{const a=pa[r.code]??={v:0};a.v+=r.rev-r.cogs-r.fee;});
  PLATS=Object.entries(pa).map(([c,a])=>({key:c,name:NAME[c]||c,ctb:a.v})).sort((x,y)=>y.ctb-x.ctb);
  const ba={};BR.forEach(r=>{if(r.brand!=="(未分攤費用)")ba[r.brand]=(ba[r.brand]||0)+r.rev-r.cogs-r.fee;});
  BRANDS=Object.entries(ba).map(([b,v])=>({key:b,name:b,ctb:v})).sort((x,y)=>y.ctb-x.ctb);
  $("upd").textContent=d.updated;
  $("foot").innerHTML=`口徑：貢獻利益 = 營收(含稅) − 商品成本 − 平台內扣/外付費用。品牌費用按各平台當月品牌營收占比分攤。`+
    `退貨已含於營收淨額；共同費用（總部薪資租金/全公司廣告）未分攤。成本以目前進價推算。`+
    `費用完整登記至 ${d.fees_through}，帶 * 月份費用未定稿。`;
  $("platSearch").addEventListener("input",e=>{S.platQ=e.target.value.trim();renderPlatChips();});
  render();
});

/* ---------- chips ---------- */
function chip(label,on,cb,cls){
  const b=document.createElement("button");
  b.className="chip"+(on?" on":"")+(cls?" "+cls:"");
  b.textContent=label;b.addEventListener("click",cb);return b;
}
// 單擊=只選這個(再點一次回全部)；Ctrl/Cmd+單擊=加入/移除複選
function pick(set,key,e){
  const multi=e.ctrlKey||e.metaKey;
  if(multi){set.has(key)?set.delete(key):set.add(key);}
  else{
    if(set.size===1&&set.has(key))set.clear();
    else{set.clear();set.add(key);}
  }
  render();
}
function renderFilters(){
  // 品牌：全部列出
  const fb=$("fBrand");fb.innerHTML="";
  fb.append(chip("全部",S.brands.size===0,()=>{S.brands.clear();render();}));
  BRANDS.forEach(it=>fb.append(chip(it.name,S.brands.has(it.key),e=>pick(S.brands,it.key,e))));
  // 通路型態
  const ft=$("fType");ft.innerHTML="";
  [["all","全部"],["ec","電商"],["phys","實體"]].forEach(([v,l])=>
    ft.append(chip(l,S.type===v,()=>{S.type=v;render();})));
  renderPlatChips();
  renderTimeRows();
}
function renderPlatChips(){
  const fp=$("fPlat");fp.innerHTML="";
  fp.append(chip("全部平台",S.plats.size===0,()=>{S.plats.clear();render();}));
  PLATS.filter(it=>typeOK(it.key))
       .filter(it=>!S.platQ||it.name.includes(S.platQ))
       .forEach(it=>fp.append(chip(it.name,S.plats.has(it.key),e=>pick(S.plats,it.key,e))));
}
function renderTimeRows(){
  const years=[...new Set(MONTHS.map(m=>m.slice(0,4)))].sort().reverse();
  const el=$("timeRows");el.innerHTML="";
  years.forEach(y=>{
    const row=document.createElement("div");row.className="frow";
    const lb=document.createElement("span");lb.className="lb";lb.textContent=y;row.append(lb);
    const box=document.createElement("div");box.className="chips";row.append(box);
    const yms=MONTHS.filter(m=>m.startsWith(y));
    const allOn=yms.every(m=>S.months.has(m));
    box.append(chip("全年",allOn,e=>{
      if(e.ctrlKey||e.metaKey){allOn?yms.forEach(m=>S.months.delete(m)):yms.forEach(m=>S.months.add(m));}
      else{S.months.clear();yms.forEach(m=>S.months.add(m));}   // 單擊＝只看該年
      render();}));
    yms.forEach(m=>{
      box.append(chip(m.replace("-",""),S.months.has(m),e=>pick(S.months,m,e)));
    });
    el.append(row);
  });
}

/* ---------- 資料選取 ---------- */
function periodMonths(){return MONTHS.filter(m=>S.months.has(m));}
const inPlat=r=>(S.plats.size===0||S.plats.has(r.code))&&typeOK(r.code);
const inBrand=r=>S.brands.size===0||S.brands.has(r.brand);
function curRows(){
  const ms=S.months;
  if(S.brands.size>0) return BR.filter(r=>ms.has(r.ym)&&inBrand(r)&&inPlat(r));
  return CH.filter(r=>ms.has(r.ym)&&inPlat(r));
}
function sum(rows){const t={rev:0,cogs:0,fee:0};
  rows.forEach(r=>{t.rev+=r.rev;t.cogs+=r.cogs;t.fee+=r.fee;});
  t.gp=t.rev-t.cogs;t.ctb=t.gp-t.fee;return t;}

function render(){
  if(S.months.size===0)MONTHS.filter(m=>m<=DATA.fees_through).forEach(m=>S.months.add(m)); // 空選擇→回預設
  renderFilters();
  const rows=curRows(), t=sum(rows), ms=periodMonths();
  $("kpis").innerHTML=[
    ["營收",fmtW(t.rev),`${ms.length} 個月`],
    ["毛利",fmtW(t.gp),`毛利率 ${pct(t.gp,t.rev)}`],
    ["通路費用",fmtW(t.fee),`占營收 ${pct(t.fee,t.rev)}`],
    ["貢獻利益",fmtW(t.ctb),`貢獻率 ${pct(t.ctb,t.rev)}`],
  ].map(([a,b,c])=>`<div class="kpi"><div class="t">${a}</div><div class="v">${b}</div><div class="d">${c}</div></div>`).join("");
  renderTrend(rows,ms);
  renderChannelBars();
  renderBrandBars();
  renderTable();
}

/* ---------- 月度趨勢：營收/貢獻利益 雙長條＋頂端數字 ---------- */
function renderTrend(rows,ms){
  const by={};ms.forEach(m=>by[m]={rev:0,cogs:0,fee:0});
  rows.forEach(r=>{const a=by[r.ym];if(a){a.rev+=r.rev;a.cogs+=r.cogs;a.fee+=r.fee;}});
  const pts=ms.map(m=>({m,rev:by[m].rev,ctb:by[m].rev-by[m].cogs-by[m].fee}));
  const W=1080,H=280,L=56,R=14,T=26,B=34,iw=W-L-R,ih=H-T-B;
  const vmax=Math.max(1,...pts.map(p=>Math.max(p.rev,p.ctb)));
  const vmin=Math.min(0,...pts.map(p=>p.ctb));
  const y=v=>T+ih-(v-vmin)/(vmax-vmin)*ih;
  const step=iw/Math.max(1,pts.length);
  const bw=Math.min(30,step*.30), gap=Math.min(6,step*.06);
  const showLab=pts.length<=13;
  let g="";
  for(let i=0;i<=4;i++){const v=vmin+(vmax-vmin)*i/4;
    g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>`+
       `<text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtW(v)}</text>`;}
  let bars="",hits="",labels="",vlabels="";
  const every=Math.ceil(pts.length/16);
  const bar=(x0,v,color)=>{
    const y0=y(0),y1=y(v);
    return `<rect x="${x0}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.max(2,Math.abs(y0-y1))}" rx="4" fill="${color}"/>`;
  };
  pts.forEach((p,i)=>{
    const cx=L+step*(i+.5);
    const xRev=cx-bw-gap/2, xCtb=cx+gap/2;
    bars+=bar(xRev,p.rev,"var(--s1)")+bar(xCtb,p.ctb,"var(--s2)");
    if(showLab){
      vlabels+=`<text x="${xRev+bw/2}" y="${y(Math.max(0,p.rev))-6}" text-anchor="middle" font-size="10.5" fill="var(--ink-2)">${fmtW(p.rev)}</text>`;
      vlabels+=`<text x="${xCtb+bw/2}" y="${y(Math.max(0,p.ctb))-6}" text-anchor="middle" font-size="10.5" fill="var(--s2)">${fmtW(p.ctb)}</text>`;
    }
    if(i%every===0){
      labels+=`<text x="${cx}" y="${H-12}" text-anchor="middle" font-size="11" fill="var(--muted)">${p.m.slice(2).replace("-","/")}</text>`;
    }
    hits+=`<rect x="${cx-step/2}" y="${T}" width="${step}" height="${ih}" fill="transparent"
      data-tip="${p.m}|營收|${fmt(p.rev)}|貢獻利益|${fmt(p.ctb)}|貢獻率|${pct(p.ctb,p.rev)}"/>`;
  });
  $("trend").innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin-top:6px">
    ${g}<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)" stroke-width="1"/>
    ${bars}${vlabels}${labels}${hits}</svg>`;
  $("trendNote").textContent = showLab?"":"月份較多時數字改以滑鼠停留顯示";
  bindTips($("trend"));
}

/* ---------- 橫條圖 ---------- */
function hbars(el,items,selSet,onClick){
  const W=520,rowH=30,L=118,R=64,T=4;
  const H=T+Math.max(1,items.length)*rowH+4;
  const vmax=Math.max(1,...items.map(i=>Math.max(i.v,0)));
  const vmin=Math.min(0,...items.map(i=>i.v));
  const x=v=>L+(v-vmin)/(vmax-vmin)*(W-L-R);
  let s="";
  items.forEach((it,i)=>{
    const yy=T+i*rowH, bx0=x(Math.min(0,it.v)),bx1=x(Math.max(0,it.v));
    const neg=it.v<0, sel=selSet.has(it.key);
    s+=`<g class="hrow" data-key="${it.key}" data-tip="${it.name}|營收|${fmt(it.rev)}|貢獻利益|${fmt(it.v)}|貢獻率|${pct(it.v,it.rev)}">
      <rect class="hbarbg" x="0" y="${yy}" width="${W}" height="${rowH-2}" fill="${sel?"var(--grid)":"transparent"}" rx="6"/>
      <text x="${L-8}" y="${yy+rowH/2+3}" text-anchor="end" font-size="12" font-weight="${sel?"700":"400"}" fill="var(--ink-2)">${it.name.length>9?it.name.slice(0,9)+"…":it.name}</text>
      <rect x="${bx0}" y="${yy+rowH/2-7}" width="${Math.max(2,bx1-bx0)}" height="12" rx="4" fill="${neg?"var(--neg)":"var(--s1)"}"/>
      <text x="${bx1+6}" y="${yy+rowH/2+3}" font-size="11.5" fill="${neg?"var(--neg)":"var(--ink-2)"}" font-variant-numeric="tabular-nums">${fmtW(it.v)}</text>
    </g>`;
  });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin-top:8px">
    <line x1="${x(0)}" x2="${x(0)}" y1="${T}" y2="${H-4}" stroke="var(--axis)" stroke-width="1"/>${s}</svg>`;
  el.querySelectorAll(".hrow").forEach(n=>n.addEventListener("click",e=>onClick(n.dataset.key,e)));
  bindTips(el);
}
function topToggle(el,cur,set){
  el.innerHTML="";
  [[20,"TOP 20"],["all","全部"]].forEach(([v,l])=>
    el.append(chip(l,cur===v,()=>{set(v);render();})));
}
function renderChannelBars(){
  topToggle($("chTop"),S.chTop,v=>S.chTop=v);
  const ms=S.months;
  const rows=S.brands.size>0?BR.filter(r=>ms.has(r.ym)&&inBrand(r)&&typeOK(r.code))
                            :CH.filter(r=>ms.has(r.ym)&&typeOK(r.code));
  const agg={};rows.forEach(r=>{const a=agg[r.code]??={rev:0,v:0};a.rev+=r.rev;a.v+=r.rev-r.cogs-r.fee;});
  let items=Object.entries(agg).map(([c,a])=>({key:c,name:NAME[c]||c,rev:a.rev,v:a.v}))
    .sort((x,y)=>y.v-x.v);
  if(S.chTop!=="all")items=items.slice(0,S.chTop);
  $("chBarsBox").style.cssText=S.chTop==="all"?"max-height:460px;overflow-y:auto":"";
  hbars($("chBars"),items,S.plats,(k,e)=>pick(S.plats,k,e));
}
function renderBrandBars(){
  topToggle($("brTop"),S.brTop,v=>S.brTop=v);
  const ms=S.months;
  const rows=BR.filter(r=>ms.has(r.ym)&&inPlat(r)&&r.brand!=="(未分攤費用)");
  const agg={};rows.forEach(r=>{const a=agg[r.brand]??={rev:0,v:0};a.rev+=r.rev;a.v+=r.rev-r.cogs-r.fee;});
  let items=Object.entries(agg).map(([b,a])=>({key:b,name:b,rev:a.rev,v:a.v}))
    .sort((x,y)=>y.v-x.v);
  if(S.brTop!=="all")items=items.slice(0,S.brTop);
  $("brBarsBox").style.cssText=S.brTop==="all"?"max-height:460px;overflow-y:auto":"";
  hbars($("brBars"),items,S.brands,(k,e)=>pick(S.brands,k,e));
}

/* ---------- 明細表 ---------- */
function renderTable(){
  const ms=S.months;
  const rows=BR.filter(r=>ms.has(r.ym)&&inPlat(r)&&inBrand(r)&&r.brand!=="(未分攤費用)");
  const platMode=S.plats.size>0&&S.brands.size===0;
  const brandMode=S.brands.size>0&&S.plats.size===0;
  const key=r=>platMode?r.brand:brandMode?(NAME[r.code]||r.code):(NAME[r.code]||r.code)+"｜"+r.brand;
  const agg={};rows.forEach(r=>{const a=agg[key(r)]??={rev:0,cogs:0,fee:0};a.rev+=r.rev;a.cogs+=r.cogs;a.fee+=r.fee;});
  const list=Object.entries(agg).map(([k,a])=>({k,...a,gp:a.rev-a.cogs,ctb:a.rev-a.cogs-a.fee}))
    .sort((x,y)=>y.ctb-x.ctb).slice(0,60);
  const head=platMode?"品牌":brandMode?"平台":"平台｜品牌";
  $("tblTitle").textContent=`明細表（${head}，依貢獻利益排序，前 ${list.length} 筆）`;
  $("tbl").innerHTML=`<table><thead><tr><th>${head}</th><th class="n">營收</th><th class="n">成本</th>
    <th class="n">毛利</th><th class="n">分攤費用</th><th class="n">貢獻利益</th><th class="n">貢獻率</th></tr></thead><tbody>`+
    list.map(r=>`<tr><td>${r.k}</td><td class="n">${fmt(r.rev)}</td><td class="n">${fmt(r.cogs)}</td>
      <td class="n">${fmt(r.gp)}</td><td class="n">${fmt(r.fee)}</td>
      <td class="n ${r.ctb<0?"negv":""}">${fmt(r.ctb)}</td><td class="n">${pct(r.ctb,r.rev)}</td></tr>`).join("")+
    `</tbody></table>`;
}

/* ---------- tooltip ---------- */
function bindTips(root){
  root.querySelectorAll("[data-tip]").forEach(n=>{
    n.addEventListener("mousemove",e=>{
      const p=n.dataset.tip.split("|");
      let h=`<div class="h">${p[0]}</div>`;
      for(let i=1;i<p.length;i+=2)h+=`<div class="r"><span>${p[i]}</span><b>${p[i+1]}</b></div>`;
      const t=$("tip");t.innerHTML=h;t.style.display="block";
      const x=Math.min(e.clientX+14,innerWidth-280),y=Math.min(e.clientY+14,innerHeight-120);
      t.style.left=x+"px";t.style.top=y+"px";
    });
    n.addEventListener("mouseleave",()=>$("tip").style.display="none");
  });
}
</script>
