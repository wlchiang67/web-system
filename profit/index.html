<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>igogo 通路×品牌 毛利 Dashboard</title>
<style>
:root{
  --surface-1:#fcfcfb; --page:#f9f9f7;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#1baf7a; --s1-soft:#9ec5f4;
  --neg:#d03b3b; --good:#006300; --chip:#efeeea;
}
@media (prefers-color-scheme: dark){
  :root{
    --surface-1:#1a1a19; --page:#0d0d0d;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#199e70; --s1-soft:#1c5cab;
    --neg:#e66767; --good:#0ca30c; --chip:#262624;
  }
}
*{box-sizing:border-box;margin:0}
body{background:var(--page);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;
  font-size:14px;line-height:1.45;padding:20px 16px 48px}
.wrap{max-width:1180px;margin:0 auto}
header h1{font-size:20px;font-weight:700}
header .sub{color:var(--ink-2);font-size:12.5px;margin-top:2px}
.fcard{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;
  padding:12px 16px;margin:14px 0}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.frow .lb{font-size:12px;color:var(--muted);width:34px;flex:none}
.chip{font:inherit;font-size:12.5px;color:var(--ink-2);background:var(--chip);
  border:1px solid transparent;border-radius:999px;padding:4px 12px;cursor:pointer;user-select:none}
.chip:hover{border-color:var(--s1)}
.chip.on{background:var(--s1);color:#fff;font-weight:600}
.chip.dim{opacity:.55}
select.more{font:inherit;font-size:12.5px;color:var(--ink-2);background:var(--chip);
  border:1px solid transparent;border-radius:999px;padding:4px 8px;max-width:110px}
.ck{font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px;margin-left:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.kpi .t{font-size:12px;color:var(--ink-2)}
.kpi .v{font-size:24px;font-weight:700;margin-top:2px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;
  padding:14px 16px;margin-bottom:12px}
.card h2{font-size:14px;font-weight:700}
.card .note{font-size:12px;color:var(--muted);margin-top:1px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-top:6px}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg text{font-family:inherit}
.hrow{cursor:pointer}
.hrow:hover .hbarbg{fill:var(--grid)}
#tip{position:fixed;pointer-events:none;background:var(--surface-1);border:1px solid var(--border);
  border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.18);padding:8px 11px;font-size:12.5px;
  color:var(--ink);display:none;z-index:10;max-width:260px}
#tip .h{font-weight:700;margin-bottom:3px}
#tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--ink-2)}
#tip .r b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--ink-2);font-weight:600;border-bottom:1px solid var(--axis);padding:6px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--grid);padding:6px 8px;font-variant-numeric:tabular-nums}
td.n,th.n{text-align:right}
tr:hover td{background:var(--page)}
.negv{color:var(--neg)}
footer{color:var(--muted);font-size:12px;margin-top:18px;line-height:1.7}
a{color:var(--s1)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>igogo 通路 × 品牌 毛利 Dashboard</h1>
    <div class="sub" id="subline">載入中…</div>
  </header>

  <div class="fcard">
    <div class="frow"><span class="lb">年份</span><span id="fYear" style="display:contents"></span>
      <label class="ck"><input type="checkbox" id="fIncomplete">含費用未定稿月</label></div>
    <div class="frow"><span class="lb">月份</span><span id="fMonth" style="display:contents"></span></div>
    <div class="frow"><span class="lb">通路</span><span id="fPlat" style="display:contents"></span></div>
    <div class="frow"><span class="lb">品牌</span><span id="fBrand" style="display:contents"></span></div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="card">
    <h2>月度趨勢</h2>
    <div class="note" id="trendNote"></div>
    <div class="legend">
      <span><span class="sw" style="background:var(--s1)"></span>營收</span>
      <span><span class="sw" style="background:var(--s2)"></span>貢獻利益</span>
    </div>
    <div id="trend"></div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>通路貢獻 TOP 12</h2>
      <div class="note">點擊列＝加入/取消通路篩選</div>
      <div id="chBars"></div>
    </div>
    <div class="card">
      <h2>品牌貢獻 TOP 12</h2>
      <div class="note">點擊列＝加入/取消品牌篩選</div>
      <div id="brBars"></div>
    </div>
  </div>

  <div class="card">
    <h2 id="tblTitle">明細表</h2>
    <div style="overflow-x:auto;margin-top:8px"><div id="tbl"></div></div>
  </div>

  <footer id="foot"></footer>
</div>
<div id="tip"></div>

<script>
const $=id=>document.getElementById(id);
const fmt=v=>Math.round(v).toLocaleString("en-US");
const fmtW=v=>{const a=Math.abs(v);
  if(a>=1e8) return (v/1e8).toFixed(2)+"億";
  if(a>=1e4) return Math.round(v/1e4).toLocaleString()+"萬";
  return fmt(v);};
const pct=(a,b)=>b?((a/b*100).toFixed(1)+"%"):"–";
let DATA=null, CH=[], BR=[], NAME={}, MONTHS=[], YEARS=[];
let PLATS=[], BRANDS=[];          // [{key,name,ctb}] 依貢獻排序
const S={year:"all", month:"all", incomplete:false, plats:new Set(), brands:new Set()};
const CHIP_N=12;

fetch("data/profit.json").then(r=>r.json()).then(d=>{
  DATA=d;
  CH=d.channel_rows.map(r=>({ym:r[0],code:r[1],plat:r[2],team:r[3],rev:r[4],cogs:r[5],fee:r[6]+r[7]}));
  BR=d.brand_rows.map(r=>({ym:r[0],code:r[1],brand:r[2],rev:r[3],cogs:r[4],fee:r[5]}));
  CH.forEach(r=>{if(r.code&&!NAME[r.code])NAME[r.code]=r.plat;});
  MONTHS=[...new Set(CH.map(r=>r.ym))].sort();
  YEARS=[...new Set(MONTHS.map(m=>m.slice(0,4)))].sort();
  const pa={};CH.forEach(r=>{const a=pa[r.code]??={v:0};a.v+=r.rev-r.cogs-r.fee;});
  PLATS=Object.entries(pa).map(([c,a])=>({key:c,name:NAME[c]||c,ctb:a.v})).sort((x,y)=>y.ctb-x.ctb);
  const ba={};BR.forEach(r=>{ba[r.brand]=(ba[r.brand]||0)+r.rev-r.cogs-r.fee;});
  BRANDS=Object.entries(ba).map(([b,v])=>({key:b,name:b,ctb:v})).sort((x,y)=>y.ctb-x.ctb);
  $("subline").textContent=`資料期間 ${MONTHS[0]} ~ ${MONTHS[MONTHS.length-1]}｜費用完整至 ${d.fees_through}｜更新 ${d.updated}`;
  $("foot").innerHTML=`口徑：貢獻利益 = 營收(含稅) − 商品成本 − 平台內扣/外付費用。品牌費用按各平台當月品牌營收占比分攤。`+
    `退貨已含於營收淨額；共同費用（總部薪資租金/全公司廣告）未分攤。`+
    `成本以目前進價推算。費用完整登記至 ${d.fees_through}，之後月份僅供參考。`;
  $("fIncomplete").addEventListener("change",e=>{S.incomplete=e.target.checked;render();});
  render();
});

/* ---------- 篩選列 ---------- */
function chip(label,on,cb,dim){
  const b=document.createElement("button");
  b.className="chip"+(on?" on":"")+(dim?" dim":"");
  b.textContent=label;b.addEventListener("click",cb);return b;
}
function renderFilters(){
  // 年份
  const fy=$("fYear");fy.innerHTML="";
  fy.append(chip("全部",S.year==="all",()=>{S.year="all";S.month="all";render();}));
  YEARS.forEach(y=>fy.append(chip(y+"年",S.year===y,()=>{S.year=(S.year===y?"all":y);if(S.year==="all")S.month="all";render();})));
  // 月份（選了年份才能挑單月）
  const fm=$("fMonth");fm.innerHTML="";
  fm.append(chip("全年",S.month==="all",()=>{S.month="all";render();}));
  if(S.year==="all"){
    const s=document.createElement("span");s.style.cssText="font-size:12px;color:var(--muted);align-self:center";
    s.textContent="（先選年份再挑單月）";fm.append(s);
  }else{
    const avail=new Set(MONTHS.filter(m=>m.startsWith(S.year)).map(m=>+m.slice(5)));
    for(let m=1;m<=12;m++){
      if(!avail.has(m))continue;
      const ym=`${S.year}-${String(m).padStart(2,"0")}`;
      const dim=ym>DATA.fees_through;
      fm.append(chip(m+"月"+(dim?"*":""),S.month===m,()=>{S.month=(S.month===m?"all":m);render();},dim));
    }
  }
  renderDimChips($("fPlat"),PLATS,S.plats);
  renderDimChips($("fBrand"),BRANDS,S.brands);
}
function renderDimChips(el,list,set){
  el.innerHTML="";
  el.append(chip("全部",set.size===0,()=>{set.clear();render();}));
  const show=list.slice(0,CHIP_N).map(i=>i.key);
  [...set].forEach(k=>{if(!show.includes(k))show.push(k);});
  show.forEach(k=>{
    const it=list.find(i=>i.key===k);if(!it)return;
    el.append(chip(it.name,set.has(k),()=>{set.has(k)?set.delete(k):set.add(k);render();}));
  });
  const rest=list.slice(CHIP_N).filter(i=>!set.has(i.key));
  if(rest.length){
    const s=document.createElement("select");s.className="more";
    s.innerHTML=`<option value="">更多…</option>`+rest.map(i=>`<option value="${i.key}">${i.name}</option>`).join("");
    s.addEventListener("change",()=>{if(s.value){set.add(s.value);render();}});
    el.append(s);
  }
}

/* ---------- 資料選取 ---------- */
function periodMonths(){
  return MONTHS.filter(m=>{
    if(!S.incomplete&&m>DATA.fees_through)return false;
    if(S.year!=="all"&&!m.startsWith(S.year))return false;
    if(S.year!=="all"&&S.month!=="all"&&+m.slice(5)!==S.month)return false;
    return true;
  });
}
const inPlat=r=>S.plats.size===0||S.plats.has(r.code);
const inBrand=r=>S.brands.size===0||S.brands.has(r.brand);
function curRows(){
  const ms=new Set(periodMonths());
  if(S.brands.size>0) return BR.filter(r=>ms.has(r.ym)&&inBrand(r)&&inPlat(r));
  return CH.filter(r=>ms.has(r.ym)&&inPlat(r));
}
function sum(rows){const t={rev:0,cogs:0,fee:0};
  rows.forEach(r=>{t.rev+=r.rev;t.cogs+=r.cogs;t.fee+=r.fee;});
  t.gp=t.rev-t.cogs;t.ctb=t.gp-t.fee;return t;}

function render(){
  renderFilters();
  const rows=curRows(), t=sum(rows), ms=periodMonths();
  $("kpis").innerHTML=[
    ["營收",fmtW(t.rev),`${ms.length} 個月`],
    ["毛利",fmtW(t.gp),`毛利率 ${pct(t.gp,t.rev)}`],
    ["通路費用",fmtW(t.fee),`占營收 ${pct(t.fee,t.rev)}`],
    ["貢獻利益",fmtW(t.ctb),`貢獻率 ${pct(t.ctb,t.rev)}`],
  ].map(([a,b,c])=>`<div class="kpi"><div class="t">${a}</div><div class="v">${b}</div><div class="d">${c}</div></div>`).join("");
  renderTrend(rows,ms);
  renderChannelBars();
  renderBrandBars();
  renderTable();
}

/* ---------- 月度趨勢 ---------- */
function renderTrend(rows,ms){
  const by={};ms.forEach(m=>by[m]={rev:0,cogs:0,fee:0});
  rows.forEach(r=>{const a=by[r.ym];if(a){a.rev+=r.rev;a.cogs+=r.cogs;a.fee+=r.fee;}});
  const pts=ms.map(m=>({m,rev:by[m].rev,ctb:by[m].rev-by[m].cogs-by[m].fee,
    incomplete:m>DATA.fees_through}));
  const W=1080,H=260,L=56,R=14,T=14,B=34,iw=W-L-R,ih=H-T-B;
  const vmax=Math.max(1,...pts.map(p=>Math.max(p.rev,p.ctb)));
  const vmin=Math.min(0,...pts.map(p=>p.ctb));
  const y=v=>T+ih-(v-vmin)/(vmax-vmin)*ih;
  const bw=Math.min(34,iw/Math.max(1,pts.length)*.55), step=iw/Math.max(1,pts.length);
  let g="";
  for(let i=0;i<=4;i++){const v=vmin+(vmax-vmin)*i/4;
    g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>`+
       `<text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtW(v)}</text>`;}
  let bars="",line="",dots="",hits="",labels="";
  const every=Math.ceil(pts.length/16);
  pts.forEach((p,i)=>{
    const cx=L+step*(i+.5);
    const by0=y(0),byv=y(p.rev);
    bars+=`<rect x="${cx-bw/2}" y="${Math.min(byv,by0)}" width="${bw}" height="${Math.max(2,Math.abs(by0-byv))}" rx="4"
      fill="var(--s1)" ${p.incomplete?'opacity=".45"':''}/>`;
    line+=(i?"L":"M")+cx+" "+y(p.ctb);
    dots+=`<circle cx="${cx}" cy="${y(p.ctb)}" r="4" fill="var(--s2)" stroke="var(--surface-1)" stroke-width="2"/>`;
    if(i%every===0){
      const lab=p.m.slice(2).replace("-","/")+(p.incomplete?"*":"");
      labels+=`<text x="${cx}" y="${H-12}" text-anchor="middle" font-size="11" fill="var(--muted)">${lab}</text>`;
    }
    hits+=`<rect x="${cx-step/2}" y="${T}" width="${step}" height="${ih}" fill="transparent"
      data-tip="${p.m}${p.incomplete?"（費用未定稿）":""}|營收|${fmt(p.rev)}|貢獻利益|${fmt(p.ctb)}|貢獻率|${pct(p.ctb,p.rev)}"/>`;
  });
  $("trend").innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin-top:6px">
    ${g}<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)" stroke-width="1"/>
    ${bars}<path d="${line}" fill="none" stroke="var(--s2)" stroke-width="2"/>${dots}${labels}${hits}</svg>`;
  $("trendNote").textContent = pts.some(p=>p.incomplete)?"* 標記月份的費用尚未登記完，貢獻利益偏高":"";
  bindTips($("trend"));
}

/* ---------- 橫條圖 ---------- */
function hbars(el,items,selSet,onClick){
  const W=520,rowH=30,L=118,R=64,T=4;
  const H=T+Math.max(1,items.length)*rowH+4;
  const vmax=Math.max(1,...items.map(i=>Math.max(i.v,0)));
  const vmin=Math.min(0,...items.map(i=>i.v));
  const x=v=>L+(v-vmin)/(vmax-vmin)*(W-L-R);
  let s="";
  items.forEach((it,i)=>{
    const yy=T+i*rowH, bx0=x(Math.min(0,it.v)),bx1=x(Math.max(0,it.v));
    const neg=it.v<0, sel=selSet.has(it.key);
    s+=`<g class="hrow" data-key="${it.key}" data-tip="${it.name}|營收|${fmt(it.rev)}|貢獻利益|${fmt(it.v)}|貢獻率|${pct(it.v,it.rev)}">
      <rect class="hbarbg" x="0" y="${yy}" width="${W}" height="${rowH-2}" fill="${sel?"var(--grid)":"transparent"}" rx="6"/>
      <text x="${L-8}" y="${yy+rowH/2+3}" text-anchor="end" font-size="12" font-weight="${sel?"700":"400"}" fill="var(--ink-2)">${it.name.length>9?it.name.slice(0,9)+"…":it.name}</text>
      <rect x="${bx0}" y="${yy+rowH/2-7}" width="${Math.max(2,bx1-bx0)}" height="12" rx="4" fill="${neg?"var(--neg)":"var(--s1)"}"/>
      <text x="${bx1+6}" y="${yy+rowH/2+3}" font-size="11.5" fill="${neg?"var(--neg)":"var(--ink-2)"}" font-variant-numeric="tabular-nums">${fmtW(it.v)}</text>
    </g>`;
  });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin-top:8px">
    <line x1="${x(0)}" x2="${x(0)}" y1="${T}" y2="${H-4}" stroke="var(--axis)" stroke-width="1"/>${s}</svg>`;
  el.querySelectorAll(".hrow").forEach(n=>n.addEventListener("click",()=>onClick(n.dataset.key)));
  bindTips(el);
}
function renderChannelBars(){
  const ms=new Set(periodMonths());
  const rows=S.brands.size>0?BR.filter(r=>ms.has(r.ym)&&inBrand(r)):CH.filter(r=>ms.has(r.ym));
  const agg={};rows.forEach(r=>{const a=agg[r.code]??={rev:0,v:0};a.rev+=r.rev;a.v+=r.rev-r.cogs-r.fee;});
  const items=Object.entries(agg).map(([c,a])=>({key:c,name:NAME[c]||c,rev:a.rev,v:a.v}))
    .sort((x,y)=>y.v-x.v).slice(0,12);
  hbars($("chBars"),items,S.plats,k=>{S.plats.has(k)?S.plats.delete(k):S.plats.add(k);render();});
}
function renderBrandBars(){
  const ms=new Set(periodMonths());
  const rows=BR.filter(r=>ms.has(r.ym)&&inPlat(r));
  const agg={};rows.forEach(r=>{const a=agg[r.brand]??={rev:0,v:0};a.rev+=r.rev;a.v+=r.rev-r.cogs-r.fee;});
  const items=Object.entries(agg).map(([b,a])=>({key:b,name:b,rev:a.rev,v:a.v}))
    .sort((x,y)=>y.v-x.v).slice(0,12);
  hbars($("brBars"),items,S.brands,k=>{S.brands.has(k)?S.brands.delete(k):S.brands.add(k);render();});
}

/* ---------- 明細表 ---------- */
function renderTable(){
  const ms=new Set(periodMonths());
  const rows=BR.filter(r=>ms.has(r.ym)&&inPlat(r)&&inBrand(r));
  const platMode=S.plats.size>0&&S.brands.size===0;
  const brandMode=S.brands.size>0&&S.plats.size===0;
  const key=r=>platMode?r.brand:brandMode?(NAME[r.code]||r.code):(NAME[r.code]||r.code)+"｜"+r.brand;
  const agg={};rows.forEach(r=>{const a=agg[key(r)]??={rev:0,cogs:0,fee:0};a.rev+=r.rev;a.cogs+=r.cogs;a.fee+=r.fee;});
  const list=Object.entries(agg).map(([k,a])=>({k,...a,gp:a.rev-a.cogs,ctb:a.rev-a.cogs-a.fee}))
    .sort((x,y)=>y.ctb-x.ctb).slice(0,60);
  const head=platMode?"品牌":brandMode?"平台":"平台｜品牌";
  $("tblTitle").textContent=`明細表（${head}，依貢獻利益排序，前 ${list.length} 筆）`;
  $("tbl").innerHTML=`<table><thead><tr><th>${head}</th><th class="n">營收</th><th class="n">成本</th>
    <th class="n">毛利</th><th class="n">分攤費用</th><th class="n">貢獻利益</th><th class="n">貢獻率</th></tr></thead><tbody>`+
    list.map(r=>`<tr><td>${r.k}</td><td class="n">${fmt(r.rev)}</td><td class="n">${fmt(r.cogs)}</td>
      <td class="n">${fmt(r.gp)}</td><td class="n">${fmt(r.fee)}</td>
      <td class="n ${r.ctb<0?"negv":""}">${fmt(r.ctb)}</td><td class="n">${pct(r.ctb,r.rev)}</td></tr>`).join("")+
    `</tbody></table>`;
}

/* ---------- tooltip ---------- */
function bindTips(root){
  root.querySelectorAll("[data-tip]").forEach(n=>{
    n.addEventListener("mousemove",e=>{
      const p=n.dataset.tip.split("|");
      let h=`<div class="h">${p[0]}</div>`;
      for(let i=1;i<p.length;i+=2)h+=`<div class="r"><span>${p[i]}</span><b>${p[i+1]}</b></div>`;
      const t=$("tip");t.innerHTML=h;t.style.display="block";
      const x=Math.min(e.clientX+14,innerWidth-280),y=Math.min(e.clientY+14,innerHeight-120);
      t.style.left=x+"px";t.style.top=y+"px";
    });
    n.addEventListener("mouseleave",()=>$("tip").style.display="none");
  });
}
</script>
</body>
</html>
